<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
    {% include navigation.html %}
    
    <main class="main-content">
        {{ content }}
    </main>
    
    <footer class="footer">
        <div class="footer-content">
            <div class="social-links">
                <a href="https://www.linkedin.com/in/michaelhunglj" target="_blank" rel="noopener noreferrer" class="social-link">LinkedIn</a>
                <a href="https://github.com/michaelhunglj" target="_blank" rel="noopener noreferrer" class="social-link">GitHub</a>
            </div>
            <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. Built with Jekyll.</p>
        </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
