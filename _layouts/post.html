---
layout: default
---

<article class="post-container">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<style>
.post-container {
  max-width: 700px;
  margin: 0 auto;
  padding: 40px 20px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  line-height: 1.6;
  color: #333;
}

.post-header {
  margin-bottom: 40px;
  text-align: center;
}

.post-title {
  font-size: 2.2em;
  font-weight: 700;
  margin-bottom: 16px;
  line-height: 1.2;
}

.post-meta {
  color: #666;
  font-size: 0.9em;
}

.post-content {
  font-size: 1.1em;
}

.post-content h2 {
  margin-top: 40px;
  margin-bottom: 16px;
  font-size: 1.5em;
}

.post-content p {
  margin-bottom: 20px;
}

.post-content img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 30px auto;
  border-radius: 4px;
}
</style>
